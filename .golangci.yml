# golangci-lint configuration (schema v2).
#
# Deliberately moderate: the standard set plus a few high-signal linters, so
# adopting lint on an existing codebase does not turn into a mass cleanup.
# Tighten by adding to linters.enable once the current set is quiet.
#
# The version is pinned in Taskfile.yml, not here — run via `task lint`.

version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck, unused
  default: standard

  enable:
    - revive      # replaces the deprecated golint; style and naming
    - misspell    # typos in comments and strings
    - unconvert   # redundant type conversions
    - errorlint   # error wrapping and comparison mistakes (%w, errors.Is)

  settings:
    revive:
      # revive's default set, minus three rules. Listing them explicitly means
      # the omissions are a visible decision rather than a silent default.
      #
      # Omitted on purpose:
      #   exported, package-comments
      #     Both demand doc comments on existing exported symbols. Worth doing,
      #     but as deliberate documentation work, not as a lint gate that makes
      #     the build red the day lint is introduced.
      #   unused-parameter
      #     Wrong for this codebase. gRPC methods must match the signature of
      #     the generated service interface, and http.HandlerFunc must take
      #     (w, r) — unused parameters there cannot be removed, and renaming
      #     them to `_` loses the information that they are ctx/req/response.
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming

  exclusions:
    # Skip files carrying a "Code generated by ... DO NOT EDIT." header.
    generated: lax

    paths:
      # Protobuf output. Belt-and-braces alongside `generated: lax` above:
      # linting code we do not write is pure noise, and buf regenerates it.
      - gen/

    rules:
      # Test files may reach for shortcuts that are wrong in production code.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofumpt

  exclusions:
    paths:
      - gen/
