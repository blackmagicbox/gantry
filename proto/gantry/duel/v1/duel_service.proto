syntax = "proto3";
package gantry.duel.v1;

service DuelService {
  rpc TriggerDuel(TriggerDuelRequest) returns (TriggerDuelResponse);
}

message TriggerDuelRequest {
  string idempotency_key = 1;
  string player_1_id = 2;
  string player_2_id = 3;
}

message TriggerDuelResponse {
  string match_id = 1;
}
